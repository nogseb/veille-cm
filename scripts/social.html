<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:Manrope;src:url('../assets/fonts/manrope.woff2') format('woff2');font-weight:200 800}
@font-face{font-family:Oswald;src:url('../assets/fonts/oswald-bold.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Playfair Display';src:url('../assets/fonts/playfair-display-extrabold-italic.woff2') format('woff2');font-weight:800;font-style:italic}
:root{--red:#ff3e52;--violet:#a78bff}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f3f2f7;font-family:Manrope,sans-serif;padding:34px}
.card{position:relative;overflow:hidden;width:100%;height:100%;border-radius:40px;background:#16141c;color:#f7f5fb;padding:56px 64px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px}
.big{width:54px;height:54px;overflow:visible}
.m-dot{fill:var(--red)}.m-arc{fill:none;stroke:var(--violet);stroke-width:2.6;stroke-linecap:round}.m-a2{opacity:.62}.m-a3{opacity:.32}
.top b{display:block;font-size:26px;letter-spacing:-.03em}.top small{display:block;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#b9b3c5;margin-top:4px}
h1{font-family:Oswald;font-weight:700;text-transform:uppercase;font-size:104px;line-height:.98;margin-top:44px;position:relative;z-index:1}
h1 span{font-family:'Playfair Display';font-style:italic;font-weight:800;text-transform:none;color:var(--red)}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:18px;font-weight:700;color:#b9b3c5;position:relative;z-index:1}
.hero-waves{position:absolute;right:-60px;bottom:-80px;width:520px}
.hero-waves .w-dot{fill:var(--red)}.hero-waves .w-arc{fill:none;stroke:var(--violet);stroke-width:2;opacity:.4}.hero-waves .w-emit{display:none}.hero-waves .w-sat{fill:var(--violet)}.hero-waves .w-sat-r{fill:var(--red)}
.hero-waves .w-static{stroke-dashoffset:0!important;animation:none!important}
</style></head><body><div class="card"><svg class="hero-waves" viewBox="0 0 440 440" aria-hidden="true"><path class="w-arc w-static" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s 0.00s cubic-bezier(.3,.7,.2,1) forwards" d="M152.85 167.42A62 62 0 0 1 152.85 272.58"/><path class="w-arc w-static" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s 0.15s cubic-bezier(.3,.7,.2,1) forwards" d="M179.35 125.02A112 112 0 0 1 179.35 314.98"/><path class="w-arc w-static" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s 0.30s cubic-bezier(.3,.7,.2,1) forwards" d="M205.85 82.62A162 162 0 0 1 205.85 357.38"/><path class="w-arc w-static" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s 0.45s cubic-bezier(.3,.7,.2,1) forwards" d="M232.34 40.21A212 212 0 0 1 232.34 399.79"/><path class="w-arc w-emit w-e1" d="M232.34 40.21A212 212 0 0 1 232.34 399.79"/><path class="w-arc w-emit w-e2" d="M232.34 40.21A212 212 0 0 1 232.34 399.79"/><path class="w-arc w-emit w-e3" d="M232.34 40.21A212 212 0 0 1 232.34 399.79"/><g class="w-orbit"><circle class="w-sat" cx="217.0" cy="164.0" r="4"/><circle class="w-sat-r" cx="270.2" cy="280.7" r="5"/><circle class="w-sat" cx="327.4" cy="175.9" r="4"/><circle class="w-sat-r" cx="167.5" cy="259.9" r="5"/></g><circle class="w-dot" cx="120" cy="220" r="16"/></svg><div class="top"><svg class="big" viewBox="0 0 40 40" aria-hidden="true"><circle class="m-dot" cx="12" cy="20" r="6"/><path class="m-arc m-a1" d="M17.74 11.81A10 10 0 0 1 17.74 28.19"/><path class="m-arc m-a2" d="M20.89 7.30A15.5 15.5 0 0 1 20.89 32.70"/><path class="m-arc m-a3" d="M24.05 2.80A21 21 0 0 1 24.05 37.20"/></svg><div><b>Veille</b><small>Communication &amp; Marque</small></div></div>
